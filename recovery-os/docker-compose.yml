services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recovery_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recovery_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recovery_os_pgdata:/var/lib/postgresql/data

volumes:
  recovery_os_pgdata:
